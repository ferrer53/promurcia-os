services:
  - type: web
    name: promurcia-os
    runtime: node
    plan: free
    buildCommand: NODE_ENV=development npm install && npm run build
    startCommand: npx drizzle-kit push --force && npx tsx scripts/seed-admin.ts && (nohup npx tsx scripts/process-drive-queue.ts process > /tmp/promurcia-drive/auto-worker.log 2>&1 &) && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./promurcia.db
      - key: OPENAI_API_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_EMAIL
        value: admin@promurcia.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administrador Promurcia
      - key: GOOGLE_SERVICE_ACCOUNT_KEY
        sync: false
      - key: GOOGLE_CLIENT_EMAIL
        sync: false
      - key: GOOGLE_PROJECT_ID
        sync: false
