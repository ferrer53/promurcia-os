services:
  - type: web
    name: promurcia-os
    runtime: node
    plan: free
    buildCommand: NODE_ENV=development npm install && npm run build
    startCommand: npx drizzle-kit push --force && npx tsx scripts/seed-admin.ts && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_EMAIL
        value: admin@promurcia.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administrador Promurcia
      - key: GOOGLE_SERVICE_ACCOUNT_KEY
        sync: false
      - key: GOOGLE_CLIENT_EMAIL
        sync: false
      - key: GOOGLE_PROJECT_ID
        sync: false
      - key: DRIVE_WORKER_ENABLED
        value: "true"
      - key: DRIVE_WORKER_INTERVAL_MS
        value: "30000"
      - key: DRIVE_DISCOVERY_ENABLED
        value: "true"
      - key: DRIVE_DISCOVERY_INTERVAL_MS
        value: "10000"
      - key: AUDIO_WORKER_ENABLED
        value: "true"
      - key: AUDIO_WORKER_INTERVAL_MS
        value: "30000"
      - key: AUDIO_WORKER_START_DELAY_MS
        value: "15000"
